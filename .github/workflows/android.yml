name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build & check
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs, as required by the org's zizmor scan.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      # The project compiles against API 37 (Android 17); install that platform.
      - name: Install compileSdk 37 platform
        run: yes | sdkmanager "platforms;android-37.0" > /dev/null

      - name: Check formatting (Spotless)
        run: ./gradlew spotlessCheck

      - name: Assemble debug
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
